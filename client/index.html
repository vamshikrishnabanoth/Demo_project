<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0b" />

  <!-- Security Meta Tags (defense-in-depth fallback) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- SEO -->
  <title>KMIT KAHOOT — Tactical Assessment & Arena</title>
  <meta name="description" content="KMIT kahoot is an AI-powered interactive quiz and assessment platform for KMIT students and faculty." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph (WhatsApp, LinkedIn previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="KMIT KAHOOT" />
  <meta property="og:description" content="AI-powered interactive quiz platform for KMIT" />
  <meta property="og:image" content="/logo.png" />

  <!-- Prevent flash of unstyled content -->
  <style>
    html { background-color: #0a0a0b; color-scheme: dark; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
