version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - app-network
    # Security: Resource limits to prevent container DoS
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # Security: Restrict filesystem writes to explicit volumes only
    volumes:
      - server-uploads:/app/uploads
      - server-logs:/app/logs
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  server-uploads:
  server-logs:
