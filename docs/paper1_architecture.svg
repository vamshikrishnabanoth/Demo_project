<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<style>
.panel{fill:#FAFAF8;stroke:#D6D6D0;stroke-width:1}
.ph{font-size:15px;font-weight:bold;fill:#222}
.ps{font-size:11px;fill:#666}
.llm{fill:#E8EEF9;stroke:#3B5BA9;stroke-width:1.4}
.det{fill:#F1F1EE;stroke:#7A7A75;stroke-width:1.4}
.art{fill:#FFF3DC;stroke:#C27C0E;stroke-width:1.8}
.fut{fill:#FFFFFF;stroke:#999;stroke-width:1.4;stroke-dasharray:6 4}
.t{font-size:13px;font-weight:bold;fill:#1A1A1A}
.s{font-size:11px;fill:#444}
.it{font-style:italic}
.open{font-size:11px;font-weight:bold;fill:#B03A2E}
.lab{font-size:10px;fill:#555;font-style:italic}
.ln{fill:none;stroke:#555;stroke-width:1.4;marker-end:url(#a)}
.lnd{fill:none;stroke:#555;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#a)}
.star{font-size:13px;font-weight:bold;fill:#C27C0E}
</style>
</defs>
<rect width="1600" height="1130" fill="#FFFFFF"/>
<rect class="panel" x="20" y="20" width="1560" height="150" rx="10"/>
<text class="ph" x="36" y="46">1  Read: every input becomes text, keeping where it came from</text>
<text class="ps" x="36" y="64">one path for every input: lecture audio or video, slides, PDFs, Word, photos and handwriting, pasted notes, code or terminal sessions, or just a topic name</text>
<rect class="det" x="40" y="70" width="300" height="88" rx="6"/>
<text class="t" x="50" y="90">Speech</text>
<text class="s" x="50" y="108">audio or video → Whisper (timed segments)</text>
<text class="s" x="50" y="122">code-mixed speech → translated to English,</text>
<text class="s" x="50" y="136">original kept</text>
<rect class="det" x="360" y="70" width="300" height="88" rx="6"/>
<text class="t" x="370" y="90">Documents and images</text>
<text class="s" x="370" y="108">PDF / PPTX / DOCX → text (slide numbers kept)</text>
<text class="s" x="370" y="122">scans, photos, handwriting → Gemini vision</text>
<text class="s" x="370" y="136">(OCR as backup)</text>
<rect class="det" x="680" y="70" width="280" height="88" rx="6"/>
<text class="t" x="690" y="90">Pasted text box</text>
<text class="s" x="690" y="108">notes; code; terminal / SQL sessions</text>
<text class="s" x="690" y="122">(classified and kept verbatim)</text>
<text class="s" x="690" y="136">instructions aimed at the AI removed</text>
<rect class="det" x="980" y="70" width="260" height="88" rx="6"/>
<text class="t" x="990" y="90">Topic name only</text>
<text class="s" x="990" y="108">→ reference notes written for</text>
<text class="s" x="990" y="122">the topic, then the same path</text>
<text class="s" x="990" y="136">(general knowledge, not a lecture)</text>
<rect class="det" x="1260" y="70" width="300" height="88" rx="6"/>
<text class="t" x="1270" y="90">Refused with a reason</text>
<text class="s" x="1270" y="108">nothing readable; nothing taught</text>
<text class="s" x="1270" y="122">(greetings, admin, banter);</text>
<text class="s" x="1270" y="136">too little content</text>
<rect class="panel" x="20" y="185" width="1560" height="405" rx="10"/>
<text class="ph" x="36" y="211">2  Understand: the lecture model (read once, cached)</text>
<text class="ps" x="36" y="229">what was actually taught, how, how deeply, and what it supports, with every point traced to the teacher’s own words</text>
<rect class="det" x="40" y="245" width="200" height="132" rx="6"/>
<text class="t" x="50" y="265">Typed blocks</text>
<text class="s" x="50" y="283">speech ≤ 60 s / 170 words</text>
<text class="s" x="50" y="297">one slide (number kept)</text>
<text class="s" x="50" y="311">code construct ≤ 12 lines</text>
<text class="s" x="50" y="325">1–2 terminal commands</text>
<text class="s" x="50" y="339">each block keeps its file</text>
<rect class="det" x="260" y="245" width="200" height="132" rx="6"/>
<text class="t" x="270" y="265">Speech–material linkage</text>
<text class="s" x="270" y="283">only when both exist</text>
<text class="s" x="270" y="297">each slide joins the part of</text>
<text class="s" x="270" y="311">the talk it matches, by shared</text>
<text class="s" x="270" y="325">words AND meaning (multilingual</text>
<text class="s" x="270" y="339">embeddings); full → next match</text>
<rect class="llm" x="480" y="245" width="200" height="132" rx="6"/>
<text class="t" x="490" y="265">Teaching points</text>
<text class="s" x="490" y="283">per window: topic, subtopic,</text>
<text class="s" x="490" y="297">depth, emphasis, teacher’s</text>
<text class="s" x="490" y="311">example, question angles,</text>
<text class="s" x="490" y="325">misconceptions</text>
<text class="s" x="490" y="339">speech-recognition slips fixed</text>
<rect class="det" x="700" y="245" width="200" height="132" rx="6"/>
<text class="t" x="710" y="265">Quote check</text>
<text class="s" x="710" y="283">a point is kept only if its</text>
<text class="s" x="710" y="297">quote appears word for word</text>
<text class="s" x="710" y="311">in the cited block</text>
<text class="s" x="710" y="325">(4.3% of points dropped)</text>
<text class="s" x="710" y="339">uncited blocks re-read</text>
<rect class="llm" x="920" y="245" width="200" height="132" rx="6"/>
<text class="t" x="930" y="265">Merge repeats</text>
<text class="s" x="930" y="283">the same point taught again</text>
<text class="s" x="930" y="297">(minute 5 and minute 40) is</text>
<text class="s" x="930" y="311">one point: both times kept,</text>
<text class="s" x="930" y="325">revisit counted</text>
<text class="s" x="930" y="339">topic names unified</text>
<rect class="llm" x="1140" y="245" width="200" height="132" rx="6"/>
<text class="t" x="1150" y="265">Calibration <tspan class="star">★</tspan></text>
<text class="s" x="1150" y="283">the whole lecture at once:</text>
<text class="s" x="1150" y="297">teacher’s intent; is it teachable;</text>
<text class="s" x="1150" y="311">what Easy/Medium/Hard mean</text>
<text class="s" x="1150" y="325">for THIS class; each point’s role;</text>
<text class="s" x="1150" y="339">each angle judged blind</text>
<rect class="det" x="1360" y="245" width="200" height="132" rx="6"/>
<text class="t" x="1370" y="265">Capacity <tspan class="star">★</tspan></text>
<text class="s" x="1370" y="283">angles per difficulty</text>
<text class="s" x="1370" y="297">recommended = distinct taught</text>
<text class="s" x="1370" y="311">points per difficulty</text>
<text class="s" x="1370" y="325">material-only points: a</text>
<text class="s" x="1370" y="339">separate supplement</text>
<path class="ln" d="M240,311 H258"/>
<path class="ln" d="M460,311 H478"/>
<path class="ln" d="M680,311 H698"/>
<path class="ln" d="M900,311 H918"/>
<path class="ln" d="M1120,311 H1138"/>
<path class="ln" d="M1340,311 H1358"/>
<path class="ln" d="M1460,377 V392 H250 V408"/>
<path class="ln" d="M640,392 V408"/>
<path class="ln" d="M1010,392 V408"/>
<path class="ln" d="M1400,392 V408"/>
<rect class="art" x="40" y="410" width="420" height="160" rx="6"/>
<text class="t" x="50" y="430">Lecture model (hierarchy)</text>
<text class="s" x="50" y="448">Lecture → topics (time share) → teaching points</text>
<text class="s" x="50" y="462">(statement, verbatim quote, blocks, timestamps,</text>
<text class="s" x="50" y="476">slides, depth, emphasis, revisits, role, meaning vector)</text>
<text class="s" x="50" y="490">→ question angles (type, focus, calibrated difficulty)</text>
<text class="s" x="50" y="504">+ intent, level, difficulty meanings, timeline,</text>
<text class="s" x="50" y="518">speech–slide contradictions</text>
<text class="s it" x="50" y="532">stored as structured data, not text chunks</text>
<rect class="det" x="480" y="410" width="320" height="160" rx="6"/>
<text class="t" x="490" y="430">Teaching style (PDI v2)</text>
<text class="s" x="490" y="448">how each point was taught: theory, code</text>
<text class="s" x="490" y="462">walkthrough, worked problems, examples,</text>
<text class="s" x="490" y="476">revision; slide fidelity (shared phrases)</text>
<text class="s" x="490" y="490">→ question-type preference + a note</text>
<text class="s" x="490" y="504">for the writer; teacher can correct it</text>
<text class="s it" x="490" y="518">replaces PDI v1 (6 upload features)</text>
<rect class="det" x="820" y="410" width="380" height="160" rx="6"/>
<text class="t" x="830" y="430">Importance of each point</text>
<text class="s" x="830" y="448">role in the intent (core / supporting /</text>
<text class="s" x="830" y="462">peripheral) + depth + emphasis +</text>
<text class="s" x="830" y="476">revisits + teaching time</text>
<text class="s" x="830" y="490">→ what to keep when fewer questions</text>
<text class="s" x="830" y="504">are asked; which reserves come first</text>
<rect class="fut" x="1220" y="410" width="340" height="160" rx="6"/>
<text class="t" x="1230" y="430">Teaching score</text>
<text class="s" x="1230" y="448">read from the same lecture model</text>
<text class="s" x="1230" y="462">not part of Paper 1 (Paper 2)</text>
<rect class="panel" x="20" y="605" width="1560" height="465" rx="10"/>
<text class="ph" x="36" y="631">3  Plan → write → check → accept → deliver</text>
<text class="ps" x="36" y="649">writer and every checker see the same teacher passage for each point; checkers come from a different model family than the writer</text>
<rect class="det" x="40" y="660" width="200" height="146" rx="6"/>
<text class="t" x="50" y="680">Teacher request</text>
<text class="s" x="50" y="698">count (≤ 30)</text>
<text class="s" x="50" y="712">Easy / Medium / Hard /</text>
<text class="s" x="50" y="726">Balanced</text>
<text class="s" x="50" y="740">topics to leave out</text>
<text class="s" x="50" y="754">style correction</text>
<rect class="art" x="260" y="660" width="200" height="146" rx="6"/>
<text class="t" x="270" y="680">Test blueprint <tspan class="star">★</tspan></text>
<text class="s" x="270" y="698">lecture first: material-only</text>
<text class="s" x="270" y="712">points only for the shortfall</text>
<text class="s" x="270" y="726">mix from calibrated capacity</text>
<text class="s" x="270" y="740">topics: capacity + time</text>
<text class="s" x="270" y="754">points: importance, style fit,</text>
<text class="s" x="270" y="768">type variety; one idea once</text>
<text class="s" x="270" y="782">(same meaning = same point)</text>
<rect class="llm" x="480" y="660" width="200" height="146" rx="6"/>
<text class="t" x="490" y="680">Write</text>
<text class="s" x="490" y="698">one question per target with</text>
<text class="s" x="490" y="712">the teacher’s passage, intent,</text>
<text class="s" x="490" y="726">what its difficulty means here,</text>
<text class="s" x="490" y="740">question type, Hard recipe,</text>
<text class="s" x="490" y="754">lecture misconceptions</text>
<text class="s" x="490" y="768">→ distractors; ≤ 45 words</text>
<text class="open" x="490" y="782">writer model: set in E17</text>
<rect class="det" x="700" y="660" width="200" height="146" rx="6"/>
<text class="t" x="710" y="680">Check each</text>
<text class="s" x="710" y="698">rule checks: format, key,</text>
<text class="s" x="710" y="712">distractors related to the</text>
<text class="s" x="710" y="726">lecture, code shown when</text>
<text class="s" x="710" y="740">the type needs it</text>
<text class="s" x="710" y="754">fail → critic + 1 repair</text>
<text class="s" x="710" y="768">Medium/Hard with nothing to</text>
<text class="s" x="710" y="782">work on → 1 rewrite</text>
<rect class="llm" x="920" y="660" width="200" height="146" rx="6"/>
<text class="t" x="930" y="680">Final Quality Gate <tspan class="star">★</tspan></text>
<text class="s" x="930" y="698">13 criteria per question:</text>
<text class="s" x="930" y="712">single answer · correctness</text>
<text class="s" x="930" y="726">(numbers recomputed) ·</text>
<text class="s" x="930" y="740">grounding · distractors · clues</text>
<text class="s" x="930" y="754">· depth · clarity · fairness …</text>
<text class="s" x="930" y="768">duplicates by meaning</text>
<rect class="llm" x="1140" y="660" width="200" height="146" rx="6"/>
<text class="t" x="1150" y="680">Blind answer check</text>
<text class="s" x="1150" y="698">another model family solves</text>
<text class="s" x="1150" y="712">without the key;</text>
<text class="s" x="1150" y="726">disagreement → rejected;</text>
<text class="s" x="1150" y="740">disputed lecture points</text>
<text class="s" x="1150" y="754">flagged to the teacher</text>
<rect class="art" x="1360" y="660" width="200" height="146" rx="6"/>
<text class="t" x="1370" y="680">Deliver</text>
<text class="s" x="1370" y="698">questions + notice: what was</text>
<text class="s" x="1370" y="712">delivered, at which</text>
<text class="s" x="1370" y="726">difficulty, any shortfall and</text>
<text class="s" x="1370" y="740">why, points from material</text>
<text class="s" x="1370" y="754">only, coverage</text>
<text class="s" x="1370" y="768">→ teacher review → students</text>
<path class="ln" d="M240,733 H258"/>
<path class="ln" d="M460,733 H478"/>
<path class="ln" d="M680,733 H698"/>
<path class="ln" d="M900,733 H918"/>
<path class="ln" d="M1120,733 H1138"/>
<path class="ln" d="M1340,733 H1358"/>
<rect class="det" x="700" y="880" width="420" height="120" rx="6"/>
<text class="t" x="710" y="900">Replace</text>
<text class="s" x="710" y="918">a rejected or failed slot takes the most important unused</text>
<text class="s" x="710" y="932">reserve of the same difficulty (nearest difficulty only if none</text>
<text class="s" x="710" y="946">is left); at most two rounds, each checked again</text>
<text class="s" x="710" y="960">a busy provider → the same point retried after a pause</text>
<path class="ln" d="M1020,806 V878"/>
<text class="lab" x="1026" y="868" text-anchor="start">rejected</text>
<path class="ln" d="M800,806 V878"/>
<text class="lab" x="806" y="868" text-anchor="start">failed</text>
<path class="lnd" d="M760,880 V808"/>
<text class="lab" x="708" y="868" text-anchor="start">re-checked</text>
<rect class="det" x="1140" y="880" width="420" height="120" rx="6"/>
<text class="t" x="1150" y="900">Model routing (free tier, 16 keys)</text>
<text class="s" x="1150" y="918">the chosen model is tried on every key (most token</text>
<text class="s" x="1150" y="932">budget first) before any other model; a short per-minute</text>
<text class="s" x="1150" y="946">reset is waited for, not switched around; work paced</text>
<text class="s" x="1150" y="960">to the number of keys</text>
<rect class="fut" x="40" y="880" width="640" height="120" rx="6"/>
<text class="t" x="50" y="900">Removed, kept in legacy/pre_single_pipeline (with reasons)</text>
<text class="s" x="50" y="918">old orchestrator + Agent 1 planner · chunk retrieval (parent/child chunks, BM25 +</text>
<text class="s" x="50" y="932">TF hybrid, reranker, alignment graph with hand-written cases) · PDI v1 router ·</text>
<text class="s" x="50" y="946">second teaching-point reader · heuristic analysis fallback · switch-off for the gate</text>
<text class="s it" x="50" y="960">the writer and the checks now share one evidence source: the lecture model</text>
<rect class="llm" x="40" y="1089" width="22" height="14" rx="3"/>
<text class="s" x="70" y="1100">LLM step</text>
<rect class="det" x="149.6" y="1089" width="22" height="14" rx="3"/>
<text class="s" x="179.6" y="1100">deterministic step</text>
<rect class="art" x="321.2" y="1089" width="22" height="14" rx="3"/>
<text class="s" x="351.2" y="1100">stored structure / output</text>
<rect class="fut" x="536.2" y="1089" width="22" height="14" rx="3"/>
<text class="s" x="566.2" y="1100">not in the Paper 1 pipeline</text>
<text class="star" x="760" y="1101">★</text><text class="s" x="776" y="1100">Paper 1 contribution</text>
<text class="open" x="930" y="1100">red</text><text class="s" x="955" y="1100">= still to be fixed by experiment</text>
<text class="ps" x="40" y="1122">Branch feat/semantic-linkage-quality. Free-tier models only: Groq qwen3.8-27b, gpt-oss-120b, gpt-oss-20b; Gemini flash / flash-lite; gemini-embedding-001. No agent framework.</text>
</svg>
